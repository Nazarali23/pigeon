<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const basePath = './index.html';
    if (!window.location.pathname.endsWith('index.html')) {
      window.location.replace(basePath + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
